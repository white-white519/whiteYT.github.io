<!DOCTYPE html>
<html lang="ru" data-theme="win95">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin_Center.sys | БЕЛЫЙ OS</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login-screen" class="win-window win-load-anim" style="max-width:480px;margin:6rem auto 0;">
    <div class="win-title-bar">
        <div class="win-title-text">Auth_Required.sys</div>
        <div class="win-title-controls">
            <button class="win-control-btn close-btn" title="На главную" onclick="location.href='index.html'">X</button>
        </div>
    </div>
    <div class="win-window-body">
        <h2 style="margin-bottom:10px;">🔒 Требуется аутентификация</h2>
        <p style="font-size:13px;line-height:1.5;margin-bottom:15px;">Введите пароль администратора.</p>
        <form id="authForm" class="upload-form" novalidate>
            <input type="password" id="authPass" class="win-input" placeholder="Пароль" required>
            <button type="submit" class="win-btn submit-btn">Войти</button>
            <a href="index.html" class="win-btn" style="text-decoration:none;">← Назад на главную</a>
            <div id="authError" class="form-error" style="display:none;" role="alert"></div>
        </form>
    </div>
</div>

<div id="admin-panel" style="display:none;">
    <main class="win-window admin-window win-load-anim">
        <div class="win-title-bar">
            <div class="win-title-text">Admin_Moderator_Console.exe</div>
            <div class="win-title-controls">
                <button class="win-control-btn close-btn" title="Выйти" onclick="logout()">X</button>
            </div>
        </div>
        <div class="win-window-body">

            <div class="admin-stats">
                <div class="win-inset admin-stat">
                    <div class="admin-stat-num" id="statQueue">0</div>
                    <div class="admin-stat-label">В очереди</div>
                </div>
                <div class="win-inset admin-stat">
                    <div class="admin-stat-num" id="statPortfolio">0</div>
                    <div class="admin-stat-label">Моё портфолио</div>
                </div>
                <div class="win-inset admin-stat">
                    <div class="admin-stat-num" id="statApproved">0</div>
                    <div class="admin-stat-label">Одобрено</div>
                </div>
            </div>

            <div class="admin-tabs" role="tablist">
                <button class="win-btn active" data-tab="moderation" onclick="switchTab('moderation', this)" role="tab">
                    📥 Модерация <span class="tab-badge" id="badge-mod">0</span>
                </button>
                <button class="win-btn" data-tab="portfolio" onclick="switchTab('portfolio', this)" role="tab">
                    🎨 Мои работы <span class="tab-badge" id="badge-port">0</span>
                </button>
                <button class="win-btn" data-tab="approved" onclick="switchTab('approved', this)" role="tab">
                    ✔ Одобрено <span class="tab-badge" id="badge-appr">0</span>
                </button>
            </div>

            <section id="tab-moderation" role="tabpanel">
                <h2 style="margin-bottom:15px;">📥 Входящие арты от подписчиков</h2>
                <div id="queue-container"></div>
            </section>

            <section id="tab-portfolio" style="display:none;" role="tabpanel">
                <h2 style="margin-bottom:15px;">🎨 Моё портфолио</h2>
                <form id="portfolioForm" class="win-inset portfolio-admin-upload" novalidate>
                    <input type="text" id="pTitle" class="win-input" placeholder="Название работы" required maxlength="80">
                    <label for="pFile" class="win-btn file-label" id="pFileLabel" tabindex="0" role="button">📎 Выбрать файл</label>
                    <input id="pFile" type="file" accept="image/*" required>
                    <button type="submit" class="win-btn submit-btn">Добавить в портфолио</button>
                    <div id="pFormError" class="form-error" style="display:none;" role="alert"></div>
                </form>
            </section>

            <section id="tab-approved" style="display:none;" role="tabpanel">
                <h2 style="margin-bottom:15px;">✔ Одобренные работы</h2>
                <div id="approved-list"></div>
            </section>

            <div style="margin-top:2rem;text-align:center;">
                <a href="index.html" class="win-btn" style="text-decoration:none;display:inline-block;">← Закрыть терминал</a>
            </div>
        </div>
    </main>
</div>

<script>
    /* ============================================================
       ⚙️ НАСТРОЙКИ SUPABASE (ПЕРЕИМЕНОВАНО В supabaseClient)
    ============================================================ */
    const SUPABASE_URL = 'https://iqyoopklaeaeiltgdmqiz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxeW9vcGtsYWVlaWx0Z2RtaXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMTI2NjksImV4cCI6MjEwODc4ODY2OX0.HDTMx-fNBaWT-BDpxmyCXLmQE8J6V4wpiaxWcdcnZ2U'; // <--- ЗАМЕНИ ЭТО НА СВОЙ ANON KEY
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_PASSWORD = 'whiteYT2026';
    const AUTH_KEY = 'whiteyt-admin-auth';

    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }
    function formatDate(iso) {
        if (!iso) return '';
        try { return new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
    }

    // Сжатие картинки
    const MAX_FILE_SIZE = 8 * 1024 * 1024;
    const MAX_DIMENSION = 1024;
    const JPEG_QUALITY  = 0.82;
    function readAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => reject(new Error('Ошибка чтения'));
            r.readAsDataURL(file);
        });
    }
    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Не картинка'));
            img.src = src;
        });
    }
    async function compressImage(file) {
        const dataUrl = await readAsDataURL(file);
        const img = await loadImage(dataUrl);
        let { width, height } = img;
        if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
            const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
            width  = Math.round(width  * ratio);
            height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        return canvas.toDataURL('image/webp', JPEG_QUALITY);
    }

    (function restoreTheme() {
        let saved = 'win95';
        try { saved = localStorage.getItem('whiteyt-theme') || 'win95'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', saved);
    })();

    function isAuthed() { try { return sessionStorage.getItem(AUTH_KEY) === '1'; } catch (e) { return false; } }
    function setAuthed(flag) { try { flag ? sessionStorage.setItem(AUTH_KEY, '1') : sessionStorage.removeItem(AUTH_KEY); } catch (e) {} }

    function showLogin() {
        document.getElementById('login-screen').style.display = '';
        document.getElementById('admin-panel').style.display = 'none';
    }
    function showAdmin() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = '';
        refreshAll();
    }
    function logout() {
        if (!confirm('Выйти?')) return;
        setAuthed(false);
        location.reload();
    }
    function handleAuth(e) {
        e.preventDefault();
        const pass = document.getElementById('authPass').value;
        const err = document.getElementById('authError');
        if (pass === ADMIN_PASSWORD) {
            setAuthed(true); err.style.display = 'none'; showAdmin();
        } else {
            err.textContent = '⚠️ Неверный пароль.'; err.style.display = 'block';
            document.getElementById('authPass').value = '';
        }
    }

    function switchTab(name, btn) {
        document.querySelectorAll('.admin-tabs .win-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['moderation', 'portfolio', 'approved'].forEach(tab => {
            document.getElementById('tab-' + tab).style.display = tab === name ? '' : 'none';
        });
    }

    async function refreshAll() {
        const { data: queue, error: qErr } = await supabaseClient.from('renders').select('*').eq('status', 'pending').order('created_at', { ascending: true });
        const { data: approved, error: aErr } = await supabaseClient.from('renders').select('*').eq('status', 'approved').order('created_at', { ascending: false });

        if (qErr || aErr) { console.error(qErr || aErr); return; }

        document.getElementById('statQueue').textContent     = queue.length;
        document.getElementById('statPortfolio').textContent = approved.filter(r => r.name === 'БЕЛЫЙ').length;
        document.getElementById('statApproved').textContent  = approved.filter(r => r.name !== 'БЕЛЫЙ').length;

        document.getElementById('badge-mod').textContent  = queue.length;
        document.getElementById('badge-port').textContent = approved.filter(r => r.name === 'БЕЛЫЙ').length;
        document.getElementById('badge-appr').textContent = approved.filter(r => r.name !== 'БЕЛЫЙ').length;

        const qContainer = document.getElementById('queue-container');
        if (!queue.length) {
            qContainer.innerHTML = `<div class="win-inset empty-state">📭 Входящих файлов нет.</div>`;
        } else {
            qContainer.innerHTML = queue.map((item, i) => `
                <div class="win-inset queue-item" style="animation-delay:${i * .05}s;">
                    <img src="${item.image_url}" class="queue-item-preview" loading="lazy">
                    <div class="queue-item-info">
                        <div class="queue-item-title">${escapeHtml(item.title)}</div>
                        <div class="queue-item-meta">👤 Автор: <strong>${escapeHtml(item.name)}</strong></div>
                        <div class="queue-item-actions">
                            <button class="win-btn btn-approve" onclick="approve(${item.id})">✔ Одобрить</button>
                            <button class="win-btn btn-reject"  onclick="reject(${item.id})">✖ Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        const aContainer = document.getElementById('approved-list');
        if (!approved.length) {
            aContainer.innerHTML = `<div class="win-inset empty-state">📭 Нет одобренных работ.</div>`;
        } else {
            aContainer.innerHTML = approved.map((item, i) => `
                <div class="win-inset queue-item" style="animation-delay:${i * .05}s;">
                    <img src="${item.image_url}" class="queue-item-preview" loading="lazy">
                    <div class="queue-item-info">
                        <div class="queue-item-title">${escapeHtml(item.title)}</div>
                        <div class="queue-item-meta">👤 Автор: <strong>${escapeHtml(item.name)}</strong></div>
                        <div class="queue-item-actions">
                            <button class="win-btn btn-reject" onclick="removeApproved(${item.id})">🗑 Убрать с сайта</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    async function approve(id) {
        const { error } = await supabaseClient.from('renders').update({ status: 'approved' }).eq('id', id);
        if (error) alert('Ошибка: ' + error.message); else refreshAll();
    }
    async function reject(id) {
        if (!confirm('Удалить заявку?')) return;
        const { error } = await supabaseClient.from('renders').delete().eq('id', id);
        if (error) alert('Ошибка: ' + error.message); else refreshAll();
    }
    async function removeApproved(id) {
        if (!confirm('Убрать с сайта?')) return;
        const { error } = await supabaseClient.from('renders').delete().eq('id', id);
        if (error) alert('Ошибка: ' + error.message); else refreshAll();
    }

    async function handlePortfolioSubmit(e) {
        e.preventDefault();
        const errBox = document.getElementById('pFormError');
        errBox.style.display = 'none';
        const title = document.getElementById('pTitle').value.trim();
        const file  = document.getElementById('pFile').files[0];

        if (!title || !file) {
            errBox.textContent = '⚠️ Заполни название и выбери файл.'; errBox.style.display = 'block'; return;
        }

        const submitBtn = e.target.querySelector('.submit-btn');
        submitBtn.disabled = true; submitBtn.textContent = 'Загрузка...';

        try {
            const compressedDataUrl = await compressImage(file);
            const blob = await (await fetch(compressedDataUrl)).blob();
            const filePath = `portfolio/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;

            const { error: uploadError } = await supabaseClient.storage.from('renders').upload(filePath, blob, { contentType: 'image/webp' });
            if (uploadError) throw uploadError;

            const { data: { publicUrl } } = supabaseClient.storage.from('renders').getPublicUrl(filePath);

            const { error: dbError } = await supabaseClient.from('renders').insert([{ name: 'БЕЛЫЙ', title, image_url: publicUrl, status: 'approved' }]);
            if (dbError) throw dbError;

            e.target.reset();
            document.getElementById('pFileLabel').textContent = '📎 Выбрать файл';
            refreshAll();
        } catch (err) {
            errBox.textContent = '⚠️ ' + err.message; errBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false; submitBtn.textContent = 'Добавить в портфолио';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (isAuthed()) showAdmin();
        else {
            showLogin();
            document.getElementById('authForm').addEventListener('submit', handleAuth);
        }
        document.getElementById('portfolioForm').addEventListener('submit', handlePortfolioSubmit);
        const pFile  = document.getElementById('pFile');
        const pLabel = document.getElementById('pFileLabel');
        pFile.addEventListener('change', () => {
            pLabel.textContent = pFile.files[0] ? '📎 ' + pFile.files[0].name : '📎 Выбрать файл';
        });
    });
</script>
</body>
</html>
