# .github/workflows/update-youtube.yml
name: Update YouTube Feed
on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов
  workflow_dispatch: # Позволяет запускать вручную

permissions:
  contents: write # ВАЖНО! Разрешает боту сохранять файлы в репозиторий

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script to fetch YouTube videos
        run: python scripts/fetch_youtube.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автообновление ленты YouTube"
          file_pattern: youtube-videos.json